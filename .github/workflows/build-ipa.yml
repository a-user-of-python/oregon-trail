name: Build Oregon Trail IPA

on:
  workflow_dispatch:
  push:

jobs:
  build:
    name: Oregon Trail unsigned IPA
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Build OregonTrail (unsigned)
        run: |
          xcodebuild build \
            -project OregonTrail.xcodeproj \
            -scheme OregonTrail \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP_PATH="build/dd/Build/Products/Release-iphoneos/OregonTrail.app"
          test -d "$APP_PATH"
          rm -rf Payload OregonTrail-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry OregonTrail-unsigned.ipa Payload
          ls -lh OregonTrail-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OregonTrail-unsigned
          path: OregonTrail-unsigned.ipa
